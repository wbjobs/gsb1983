<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAG 可视化 · 布局 / 高亮 / 路径查找</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="brand">DAG 可视化</div>

      <label class="control">
        示例
        <select id="sample-select"></select>
      </label>

      <label class="control checkbox">
        <input type="checkbox" id="perf-toggle" />
        Canvas 性能模式
      </label>

      <button id="btn-fit" type="button">适应视图</button>

      <div class="path-search">
        <select id="path-from" title="起点"></select>
        <span class="arrow">→</span>
        <select id="path-to" title="终点"></select>
        <button id="btn-path" type="button">查找路径</button>
        <button id="btn-clear" type="button" class="ghost">清除高亮</button>
      </div>

      <div class="spacer"></div>
      <div id="stats" class="stats" aria-live="polite"></div>
    </header>

    <main class="stage">
      <canvas id="edge-canvas"></canvas>
      <svg id="node-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="empty-hint" class="empty-hint" hidden>暂无数据，请选择一个示例或粘贴 JSON</div>
      <aside id="detail-panel" class="detail-panel" hidden>
        <button id="panel-close" class="panel-close" type="button" aria-label="关闭">×</button>
        <div id="panel-content"></div>
      </aside>
      <div id="tooltip" class="tooltip" hidden></div>
    </main>

    <footer class="statusbar">
      <div id="toast" class="toast" role="alert" hidden></div>
      <div class="hint">滚轮缩放 · 拖拽空白平移 · 单击节点查看上下游 · 双击节点设为路径起点</div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
